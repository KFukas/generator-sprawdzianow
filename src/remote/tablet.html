<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1e3a8a" />
<title>Sprawdzian</title>
<link rel="stylesheet" href="quiz.css" />
<script src="quiz.js"></script>
<style>
  :root {
    --bg: #f3f4f9; --panel: #fff; --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --line: #e2e8f0; --line-2: #cbd5e1;
    --accent: #1e3a8a; --accent-soft: #eef2fb; --accent-line: #c7d2ee;
    --ok: #059669; --ok-soft: #d1fae5; --bad: #dc2626; --bad-soft: #fee2e2; --warn: #b45309; --warn-soft: #fef3c7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-size: 17px; line-height: 1.45; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
  .head { background: var(--panel); border-radius: 22px; padding: 22px 20px; box-shadow: 0 8px 30px rgba(15, 23, 42, .08); margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0 0 4px; line-height: 1.25; }
  .sub { color: var(--muted); font-size: 15px; }
  .name { width: 100%; height: 52px; margin-top: 14px; border: 2px solid var(--line-2); border-radius: 14px; padding: 0 14px; font-size: 18px; background: #fff; outline: none; }
  .name:focus, textarea:focus, .gap:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .q { background: var(--panel); border-radius: 20px; padding: 18px 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(15, 23, 42, .05); }
  .q-head { display: flex; gap: 10px; align-items: flex-start; }
  .num { flex-shrink: 0; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .q-text { flex: 1; font-weight: 650; font-size: 18px; }
  .pts { flex-shrink: 0; color: var(--muted); font-size: 14px; white-space: nowrap; padding-top: 4px; }
  .mark { flex-shrink: 0; font-weight: 800; padding: 3px 10px; border-radius: 10px; font-size: 14px; }
  .mark.ok { background: var(--ok-soft); color: var(--ok); }
  .mark.bad { background: var(--bad-soft); color: var(--bad); }
  .mark.part { background: var(--warn-soft); color: var(--warn); }
  .mark.wait { background: var(--line); color: var(--muted); }
  .fig { display: block; max-width: 100%; max-height: 340px; margin: 12px auto 4px; border-radius: 10px; border: 1px solid var(--line); }
  .opts { display: grid; gap: 10px; margin-top: 14px; }
  .opt { display: flex; align-items: center; gap: 12px; min-height: 56px; text-align: left; padding: 10px 14px; border: 2px solid var(--line-2); border-radius: 16px; background: #fff; font-size: 17px; }
  .opt .l { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink-2); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.sel .l { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tf-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .tf-row:first-child { border-top: 0; }
  .tf-row .t { flex: 1; }
  .pf { width: 56px; height: 50px; border: 2px solid var(--line-2); border-radius: 14px; background: #fff; font-weight: 800; font-size: 18px; }
  .pf.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .m-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .m-row:first-child { border-top: 0; }
  .m-row .t { flex: 1; font-weight: 600; }
  select { height: 50px; min-width: 76px; border: 2px solid var(--line-2); border-radius: 14px; background: #fff; font-weight: 800; font-size: 18px; padding: 0 8px; }
  .right { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: var(--bg); font-size: 15px; }
  .right div { padding: 3px 0; }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .bank span { padding: 6px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .gap-row { padding: 10px 0; border-top: 1px solid var(--line); line-height: 2.4; }
  .gap-row:first-child { border-top: 0; }
  .gap { width: 150px; max-width: 60vw; height: 44px; border: 2px solid var(--line-2); border-radius: 12px; padding: 0 10px; margin: 0 4px; font-size: 17px; outline: none; }
  textarea { width: 100%; min-height: 130px; margin-top: 12px; border: 2px solid var(--line-2); border-radius: 16px; padding: 12px 14px; font-size: 17px; resize: vertical; outline: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255, 255, 255, .92); backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; justify-content: center; }
  .bar .info { color: var(--muted); font-size: 15px; }
  .btn { height: 56px; padding: 0 26px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 18px; }
  .btn:disabled { opacity: .5; }
  .timer { position: sticky; top: 0; z-index: 5; margin: -16px -16px 16px; padding: 10px 16px; background: var(--ink); color: #fff; font-weight: 700; text-align: center; font-size: 18px; }
  .timer.low { background: var(--bad); }
  .center { min-height: 80vh; display: grid; place-items: center; text-align: center; }
  .card { background: var(--panel); border-radius: 24px; padding: 30px 24px; box-shadow: 0 8px 30px rgba(15, 23, 42, .08); max-width: 480px; width: 100%; }
  .card h2 { margin: 6px 0 8px; font-size: 26px; }
  .big { font-size: 46px; font-weight: 800; color: var(--accent); margin: 6px 0; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><div class="muted">Wczytuję sprawdzian…</div></div></div>
<script>
"use strict";
const KEY = "sprawdzian:" + location.pathname;
const LETTERS = "ABCDEFGHIJ";
const newCid = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
let CID = (() => {
  try {
    let c = localStorage.getItem(KEY + ":cid");
    if (!c) localStorage.setItem(KEY + ":cid", (c = newCid()));
    return c;
  } catch (e) {
    return newCid();
  }
})();
const post = (url, body) =>
  fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then((r) => r.json())
    .then((j) => {
      if (!j.ok) throw new Error(j.error || "błąd");
      return j;
    });
let T = null;
let S = { name: "", answers: {}, startedAt: 0, submitted: null };
const app = document.getElementById("app");

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.answers) S = v; } catch (e) {} };
const num = (x) => String(x).replace(".", ",");
const plural = (n, a, b, c) => (n === 1 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? b : c);

function answeredCount() {
  return T.questions.filter((q) => {
    const a = S.answers[q.id];
    if (a == null || a === "") return false;
    if (typeof a === "object") return Object.values(a).some((v) => v !== "" && v != null);
    return true;
  }).length;
}

function markFor(q) {
  const r = S.submitted && S.submitted.marks ? S.submitted.marks[q.id] : undefined;
  if (r === undefined) return null;
  if (r === null) return h("span", { class: "mark wait" }, T.requireName ? "oceni nauczyciel" : "oceni rodzic");
  if (r.score >= r.max) return h("span", { class: "mark ok" }, "✓ " + num(r.score) + "/" + r.max);
  return h("span", { class: "mark " + (r.score > 0 ? "part" : "bad") }, (r.score > 0 ? "½ " : "✗ ") + num(r.score) + "/" + r.max);
}

function setAns(q, val) { S.answers[q.id] = val; save(); }
function setPart(q, i, val) { const a = Object.assign({}, S.answers[q.id] || {}); a[i] = val; setAns(q, a); }

function renderTask(q, n) {
  const done = Boolean(S.submitted);
  const a = S.answers[q.id];
  const box = h("section", { class: "q" },
    h("div", { class: "q-head" }, h("span", { class: "num" }, n), h("div", { class: "q-text" }, q.question), markFor(q) || h("span", { class: "pts" }, q.points + " pkt")),
    (q.figures || []).map((src) => h("img", { class: "fig", src, alt: "" }))
  );
  if (q.format === "abc") {
    box.append(h("div", { class: "opts" }, q.options.map((o, k) =>
      h("button", { class: "opt" + (a === k ? " sel" : ""), disabled: done, onclick: () => { setAns(q, k); render(); } }, h("span", { class: "l" }, LETTERS[k]), o))));
  } else if (q.format === "tf") {
    box.append(h("div", { class: "opts" }, q.statements.map((st, k) => {
      const v = a ? a[k] : undefined;
      return h("div", { class: "tf-row" }, h("span", { class: "t" }, (k + 1) + ". " + st),
        h("button", { class: "pf" + (v === true ? " sel" : ""), disabled: done, onclick: () => { setPart(q, k, true); render(); } }, "P"),
        h("button", { class: "pf" + (v === false ? " sel" : ""), disabled: done, onclick: () => { setPart(q, k, false); render(); } }, "F"));
    })));
  } else if (q.format === "match") {
    box.append(h("div", { class: "opts" }, q.left.map((l, k) => {
      const sel = h("select", { disabled: done, onchange: (e) => setPart(q, k, e.target.value === "" ? undefined : +e.target.value) },
        h("option", { value: "" }, "–"), q.right.map((_, j) => h("option", { value: j, selected: a && a[k] === j }, LETTERS[j])));
      return h("div", { class: "m-row" }, h("span", { class: "t" }, (k + 1) + ". " + l), sel);
    })), h("div", { class: "right" }, q.right.map((r, j) => h("div", {}, h("b", {}, LETTERS[j] + ". "), r))));
  } else if (q.format === "gap") {
    if (q.bank) box.append(h("div", { class: "bank" }, q.bank.map((w) => h("span", {}, w))));
    box.append(h("div", {}, q.items.map((it, k) => h("div", { class: "gap-row" }, (k + 1) + ". " + it.before,
      h("input", { class: "gap", value: a && a[k] ? a[k] : "", disabled: done, autocomplete: "off", autocapitalize: "off", spellcheck: "false", oninput: (e) => setPart(q, k, e.target.value) }),
      it.after))));
  } else {
    box.append(h("textarea", { placeholder: "Napisz odpowiedź…", disabled: done, oninput: (e) => setAns(q, e.target.value) }, a || ""));
  }
  return box;
}

let timerId = 0;
function remaining() { return T.timeLimit ? Math.max(0, T.timeLimit * 60 - Math.floor((Date.now() - S.startedAt) / 1000)) : null; }
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function tick() {
  const el = document.getElementById("timer");
  const r = remaining();
  if (r == null || S.submitted) return clearInterval(timerId);
  if (el) { el.textContent = "Zostało " + mmss(r); el.classList.toggle("low", r <= 60); }
  if (r <= 0) { clearInterval(timerId); submit(true); }
}

function render() {
  app.replaceChildren();
  if ((T.timeLimit || T.requireName) && !S.startedAt && !S.submitted) {
    const err = h("p", { class: "err" });
    app.append(h("div", { class: "center" }, h("div", { class: "card" },
      h("div", { class: "muted" }, T.subject || "Sprawdzian"), h("h2", {}, T.title),
      h("p", {}, T.questions.length + " " + plural(T.questions.length, "zadanie", "zadania", "zadań") + (T.timeLimit ? " · limit czasu:" : "")),
      T.timeLimit ? h("div", { class: "big" }, T.timeLimit + " min") : null,
      h("p", { class: "muted" }, T.timeLimit ? "Czas zacznie płynąć po kliknięciu „Zaczynam”. Gdy minie, odpowiedzi wyślą się same." : "Wpisz swoje imię i kliknij „Zaczynam”."),
      h("input", { class: "name", placeholder: "Twoje imię", value: S.name, oninput: (e) => { S.name = e.target.value; save(); } }),
      err,
      h("button", { class: "btn", onclick: () => {
        if (T.requireName && !String(S.name || "").trim()) return void (err.textContent = "Wpisz swoje imię.");
        post("hello", { c: CID, name: S.name }).catch(() => {});
        S.startedAt = Date.now(); save(); render();
      } }, "Zaczynam"))));
    return;
  }
  if (!S.startedAt) { S.startedAt = Date.now(); save(); }
  if (T.timeLimit && !S.submitted) app.append(h("div", { class: "timer", id: "timer" }, ""));
  const head = h("div", { class: "head" }, h("div", { class: "sub" }, T.subject || "Sprawdzian"), h("h1", {}, T.title),
    h("input", { class: "name", placeholder: "Twoje imię", value: S.name, disabled: Boolean(S.submitted), oninput: (e) => { S.name = e.target.value; save(); } }));
  app.append(head);
  if (S.submitted) app.append(resultCard());
  T.questions.forEach((q, i) => app.append(renderTask(q, i + 1)));
  if (!S.submitted) {
    app.append(h("div", { class: "bar" }, h("span", { class: "info", id: "info" }, "Odpowiedzi: " + answeredCount() + " / " + T.questions.length),
      h("button", { class: "btn", id: "send", onclick: () => submit(false) }, "Zakończ i wyślij")));
    clearInterval(timerId);
    if (T.timeLimit) { timerId = setInterval(tick, 1000); tick(); }
  }
}

function resultCard() {
  const r = S.submitted;
  return h("div", { class: "card", style: "margin: 0 auto 16px" },
    h("div", { class: "muted" }, r.timeUp ? "Czas minął – odpowiedzi wysłane" : "Odpowiedzi wysłane ✓"),
    h("h2", {}, "Twój wynik"),
    h("div", { class: "big" }, num(r.closed) + " / " + r.closedMax + " pkt"),
    h("p", { class: "muted" }, r.openMax ? "To wynik zadań zamkniętych. Zadania otwarte (" + r.openMax + " pkt) oceni " + (T.requireName ? "nauczyciel." : "rodzic.") : r.grade ? "Ocena: " + r.grade : ""));
}

async function submit(timeUp) {
  if (S.submitted) return;
  if (!timeUp && T.requireName && !String(S.name || "").trim()) return alert("Wpisz swoje imię na górze strony.");
  const empty = T.questions.length - answeredCount();
  if (!timeUp && empty && !confirm("Bez odpowiedzi: " + empty + " " + plural(empty, "zadanie", "zadania", "zadań") + ". Wysłać mimo to?")) return;
  const btn = document.getElementById("send");
  if (btn) { btn.disabled = true; btn.textContent = "Wysyłam…"; }
  try {
    const res = await fetch("submit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ c: CID, name: S.name, answers: S.answers, seconds: Math.round((Date.now() - S.startedAt) / 1000), timeUp }) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || "błąd");
    S.submitted = Object.assign({ timeUp }, j.result || { closed: 0, closedMax: 0, openMax: 0, marks: {} });
    save();
    render();
    scrollTo(0, 0);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Zakończ i wyślij"; }
    alert("Nie udało się wysłać odpowiedzi. Sprawdź, czy tablet jest w tej samej sieci Wi-Fi co komputer, i spróbuj ponownie.");
  }
}

function startQuiz() {
  let game = null;
  app.className = "";
  const run = () => {
    if (game) game.destroy();
    game = QuizGame.mount(app, {
      title: T.title,
      items: T.items,
      name: S.name || T.defaultName || "",
      askName: true,
      requireName: Boolean(T.requireName),
      onStart: (name) => {
        S.name = name;
        save();
        return post("hello", { c: CID, name });
      },
      check: (i, a, ms) => post("check", { c: CID, i, a, ms }).then((j) => j.result),
      onFinish: () => post("submit", { c: CID, name: S.name }).then((j) => j.result || null),
      allowReplay: !T.requireName,
      onReplay: () => {
        CID = newCid();
        run();
      },
    });
  };
  run();
}

document.addEventListener("input", () => { const i = document.getElementById("info"); if (i && T && T.questions) i.textContent = "Odpowiedzi: " + answeredCount() + " / " + T.questions.length; });

fetch("test.json").then((r) => { if (!r.ok) throw new Error(); return r.json(); }).then((t) => {
  T = t;
  document.title = t.title;
  load();
  if (S.testId !== t.id) S = { name: S.name || t.defaultName || "", answers: {}, startedAt: 0, submitted: null, testId: t.id };
  if (t.mode === "quiz") return startQuiz();
  render();
}).catch(() => {
  app.replaceChildren(h("div", { class: "center" }, h("div", { class: "card" }, h("h2", {}, "Nie można wczytać sprawdzianu"), h("p", { class: "muted" }, "Udostępnianie zostało zatrzymane albo kod QR jest nieaktualny. Poproś rodzica o nowy kod."))));
});
</script>
</body>
</html>
